<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>광나루 리버스 | 가입 안내</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">GWANGNARU RIVERS</p>
      <h1>같이 모여볼래요?</h1>
      <p>광나루 리버스 가입 절차를 안내해드립니다.</p>
    </section>

    <section class="steps">
      <div class="step-card">
        <div class="step-number">01</div>
        <div class="step-content">
          <span class="step-label">1단계</span>
          <h2>당근 모임 가입</h2>
          <p>먼저 광나루 리버스 당근 모임에 가입해주세요.</p>
          <a id="carrotBtn" class="button" href="#" target="_blank" rel="noopener">당근 모임 가입하기</a>
        </div>
      </div>

      <div class="arrow">↓</div>

      <div class="step-card">
        <div class="step-number">02</div>
        <div class="step-content">
          <span class="step-label">2단계</span>
          <h2>광나루 야구단 가입</h2>
          <p>당근 모임 가입 후 광나루 야구단 가입 문의를 진행해주세요.</p>
          <a id="teamBtn" class="button" href="#" target="_blank" rel="noopener">광나루 야구단 가입 문의</a>
        </div>
      </div>
    </section>

    <section class="notice">
      <h2>궁금한 점이 있나요?</h2>
      <p>가입 과정이나 활동에 대해 궁금한 점은 아래로 문의해주세요.</p>
      <div class="contact-buttons">
        <a id="kakaoBtn" class="contact-button" href="#" target="_blank" rel="noopener">카카오톡 문의</a>
        <a id="emailBtn" class="contact-button" href="#">이메일 문의</a>
      </div>
    </section>

    <footer>© 2026 GANGNARU RIVERS</footer>
  </main>

  <script src="links.js"></script>
  <script>
    document.getElementById("carrotBtn").href = JOIN_LINKS.carrot;
    document.getElementById("teamBtn").href = JOIN_LINKS.team;
    document.getElementById("kakaoBtn").href = JOIN_LINKS.kakao;
    document.getElementById("emailBtn").href = JOIN_LINKS.email;
  </script>
</body>
</html>
